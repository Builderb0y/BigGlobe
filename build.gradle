plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sourceSets {
	main {
		java {
			if (file('../AutoCodec/src/main/java').exists()) {
				srcDir '../AutoCodec/src/main/java'
			}
		}
	}
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			systemProperty 'neoforge.logging.markers', 'REGISTRIES'
			systemProperty 'neoforge.logging.console.level', 'info'
		}
		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.logging.markers', 'REGISTRIES'
			systemProperty 'neoforge.logging.console.level', 'info'
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

tasks.register('runMinecraft') {
	group = 'mod development'
	description = 'Runs Minecraft client with the Big Globe mod'
	dependsOn 'runClient'
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name = 'Mojang'
		url = 'https://libraries.minecraft.net'
	}
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup('maven.modrinth')
		}
	}
	maven {
		name = 'Sonatype Snapshots'
		url = 'https://oss.sonatype.org/content/repositories/snapshots/'
	}
}

dependencies {
	String AUTO_CODEC_VERSION = '6.0.3'
	implementation("builderb0y:autocodec:$AUTO_CODEC_VERSION") {
		transitive = false
	}
	jarJar("builderb0y:autocodec:$AUTO_CODEC_VERSION")

	implementation 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
	compileOnly 'maven.modrinth:distanthorizonsapi:7.2.0'

	annotationProcessor('systems.manifold:manifold-preprocessor:2025.1.27')
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.add('-parameters')
	options.compilerArgs.add('-Xplugin:Manifold')
}
