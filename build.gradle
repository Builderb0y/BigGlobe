	if (!Boolean.getBoolean('skipJIJExtraction')) {
		extractDependencies()
	}
	modImplementation(fileTree(new File('jijDependencies/implementation')))
	modCompileOnly   (fileTree(new File('jijDependencies/compileOnly')))
	modRuntimeOnly   (fileTree(new File('jijDependencies/runtimeOnly')))
}

