repositories() {
	//Add repositories to retrieve artifacts from in here.
	//You should only use this when depending on other mods because
	//Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	//See https://docs.gradle.org/current/userguide/declaring_repositories.html
	//for more information about repositories.

	mavenLocal() //AutoCodec

	maven() {
		name('Modrinth')
		url('https://api.modrinth.com/maven')
		content() {
			includeGroup('maven.modrinth')
		}
	}

	//manifold
	maven() {
		url('https://oss.sonatype.org/content/repositories/snapshots/')
	}

	//loom does this automatically, but does it too late.
	//we need to ensure this gets added as a repository before
	//all the hacks below that make JIJ dependencies work.
	maven() {
		name = 'MavenCentralLWJGL' //loom checks for this name, so it cannot be changed.
		url(ArtifactRepositoryContainer.MAVEN_CENTRAL_URL)
		content() {
			includeGroup('org.lwjgl')
		}
	}
}

static void extractNestedJars(File dependenciesFolder, File toUnpack) {
	ByteArrayOutputStream baos = new ByteArrayOutputStream(toUnpack.length() as int)
	try (
		JarFile jar = new JarFile(toUnpack)
		JarOutputStream zip = new JarOutputStream(baos)
	) {
		Enumeration<JarEntry> entries = jar.entries()
		while (entries.hasMoreElements()) {
			JarEntry entry = entries.nextElement()
			String name = entry.getName()
			//DH includes sources in the API jar.
			//for whatever dumb reason, this gives me an error on compile that says
			//"[...] is a public class, so it should be in a file named [...].java".
			//this issue doesn't happen when the .java files are stripped out of the jar.
			if (!name.endsWith('.java')) {
				zip.putNextEntry(entry)
				jar.getInputStream(entry).transferTo(zip)
			}
			//DH *also* includes fabric API. strip that out too.
			if (name.startsWith('META-INF/jars/') && name.endsWith('.jar') && !name.regionMatches(false, 'META-inf/jars/'.length(), 'fabric-', 0, 'fabric-'.length())) {
				name = name.substring('META-INF/jars/'.length())
				File unpackDir = new File(dependenciesFolder, name.substring(0, name.length() - '.jar'.length()))
				unpackDir.mkdir()
				File unpacked = new File(unpackDir, name)
				try (FileOutputStream out = new FileOutputStream(unpacked)) {
					jar.getInputStream(entry).transferTo(out)
				}
				extractNestedJars(unpackDir, unpacked)
			}
		}
	}
	toUnpack.bytes = baos.toByteArray()
}

void extractDependencies() {
	File jijDependenciesFolder = file('jijDependencies')
	jijDependenciesFolder.deleteDir()
	jijDependenciesFolder.mkdir()
	for (String dependencyType : [ 'implementation', 'runtimeOnly', 'compileOnly' ]) {
		File specificDependenciesFolder = new File(jijDependenciesFolder, dependencyType)
		specificDependenciesFolder.mkdir()
		for (File from : file("dependencies/${ project.minecraft_version }/$dependencyType").listFiles()) {
			String fileName = from.getName()
			File fromRoot = new File(specificDependenciesFolder, fileName.substring(0, fileName.length() - '.jar'.length()))
			fromRoot.mkdir()
			File to = new File(fromRoot, fileName)
			if (!to.exists()) {
				Files.copy(from.toPath(), to.toPath())
				extractNestedJars(fromRoot, to)
			}
		}
	}
}

dependencies() {
	minecraft("com.mojang:minecraft:${ project.minecraft_version }")
	implementation("net.fabricmc:fabric-loader:${ project.loader_version }")
	implementation("net.fabricmc.fabric-api:fabric-api:${ project.fabric_version }")

	testImplementation('org.junit.jupiter:junit-jupiter:5.7.1')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')

	String AUTO_CODEC_VERSION = '6.0.3'
	implementation("builderb0y:autocodec:$AUTO_CODEC_VERSION") {
		transitive = false //don't include different version of DFU than what minecraft uses.
	}
	include("builderb0y:autocodec:$AUTO_CODEC_VERSION")

	annotationProcessor('systems.manifold:manifold-preprocessor:2025.1.27')

	if (!Boolean.getBoolean('skipJIJExtraction')) {
		extractDependencies()
	}
	implementation(fileTree(new File('jijDependencies/implementation')))
	compileOnly   (fileTree(new File('jijDependencies/compileOnly')))
	runtimeOnly   (fileTree(new File('jijDependencies/runtimeOnly')))
}

